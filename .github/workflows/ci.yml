name: CI/CD pipeline

on:
  push:
    branches: [ "**" ]

jobs:
  # Uncomment the following job to enable CodeQL scanning
  # codeql_scan:
  #   name: CodeQL scan
  #   runs-on: ubuntu-latest
  #   permissions:
  #     actions: read
  #     contents: read
  #     security-events: write
  #   steps:
