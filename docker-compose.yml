

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"   # Vue dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules  # prevent overwriting node_modules
    environment:
      - NODE_ENV=development

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
