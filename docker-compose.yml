

services:
  frontend:
    build: ./frontend
    ports:
      - "5174:5173"  # Vue dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules  # prevent overwriting node_modules
    environment:
      - NODE_ENV=development

  backend:
    build: ./backend
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
