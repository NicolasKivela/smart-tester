

services:
  frontend:
    build: ./frontend
    ports:
      - "5174:5173"  # Vue dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules  # prevent overwriting node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

networks:
  app-network:
    driver: bridge